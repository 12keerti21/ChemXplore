{% extends "base.html" %}
{% block content %}
    <!-- ATC Code Selection -->
    <div class="form-group mb-4">
        <label for="atc-code-select" class="form-label">Select ATC Code:</label>
        <select class="form-select" id="atc-code-select" name="atc-code">
            {% for code in drugbank_atc_codes %}
                <option value="{{ code }}" {% if code == atc_code %}selected{% endif %}>
                    {{ code }}
                </option>
            {% endfor %}
        </select>
        <small class="form-text text-muted">
            Current DrugBank size: <span id="drugbank-size">{{ drugbank_size }}</span> molecules
            {% if atc_code != 'all' %}
            (out of {{ drugbank_total_size }} total)
            {% endif %}
        </small>
    </div>

    <!-- Rest of your content -->
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/atc_handler.js') }}"></script>
{% endblock %}
