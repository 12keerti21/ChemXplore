{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>ADMET Prediction Results</h2>
    
    <div class="row">
        <div class="col-12">
            <img src="data:image/png;base64,{{ plot_url }}" 
                 class="img-fluid" 
                 alt="ADMET Results Distribution">
        </div>
    </div>
    
    <div class="row mt-4">
        <div class="col-12">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Property</th>
                        <th>Prediction</th>
                        <th>Confidence</th>
                    </tr>
                </thead>
                <tbody>
                    {% for prop, value in predictions.items() %}
                    <tr>
                        <td>{{ prop|title }}</td>
                        <td>{{ "%.3f"|format(value) }}</td>
                        <td>{{ "%.2f"|format(confidence[prop]) if confidence }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
